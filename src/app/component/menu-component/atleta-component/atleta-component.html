<div id="div-form">

  <form id="form-atleta">

    <label for="nome">Nome</label>
    <input type="text" name="nome" id="nome" class="input01" required maxlength="80" placeholder="Informe seu nome">

    <label for="cpf">CPF</label>
    <input type="text" name="cpf" id="cpf" class="input02" required maxlength="14" placeholder="Informe seu cpf">

    <label for="sexo">Sexo</label>
    <input type="radio" name="sexo" id="sexoM" class="bntSelecao" value="M">Masculino
    <input type="radio" name="sexo" id="sexoF" class="bntSelecao" value="F">Feminino
    <input type="radio" name="sexo" id="sexoND" class="bntSelecao" value="ND">Não Declarar


    <label for="cep">CEP</label>
    <input type="text" name="cep" id="cep" class="input02" required maxlength="9" placeholder="Informe seu CEP">

    <label for="rua-logradouro">Rua/Logradouro</label>
    <input type="text" name="rua-logradouro" id="rua-logradouro" class="input01" required maxlength="20" placeholder="Informe sua Rua">

    <label for="bairro">Bairro</label>
    <input type="text" name="bairro" id="bairro" class="input02" required maxlength="20" placeholder="Informe seu bairro">

    <label for="cidade">Cidade</label>
    <input type="text" name="cidade" id="cidade" class="input02" required maxlength="20" placeholder="Informe sua cidade">

    <label for="uf">Bairro</label>
    <input type="text" name="uf" id="uf" class="input02" required maxlength="2" placeholder="Informe seu UF">

    <div id="div-bnts">
      <button type="submit" id="bntAdd">Cadastrar Atleta</button>
      <button type="reset" id="bntLimpar">Limpar Dados</button>

    </div>



  </form>
</div>
