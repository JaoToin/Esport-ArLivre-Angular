<div id="div-lista">
  <h2>Lista Atleta</h2>

<div id="lista-atletas">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>CPF</th>
        <th>Sexo</th>
        <th>Cidade</th>
        <th>UF</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      @for (elem of listaAtletas(); track elem.id) {
        <tr class="item-atletas">
          <td>{{elem.id}}</td>
          <td>{{elem.nome}}</td>
          <td>{{elem.cpf}}</td>
          <td>{{elem.sexo}}</td>
          <td>{{elem.cidade}}</td>
          <td>{{elem.uf}}</td>
          <td class="links-lista">
            <a class="lnk-editar" (click)="buscarPessoa(elem)"> Editar </a> |
            <a class="lnk-excluir" (click)="excluirAtleta(elem)"> Excluir </a>
          </td>
        </tr>
      } @empty {
        <tr>
          <!-- O colspan="7" garante que a mensagem ocupe todas as colunas da tabela -->
          <td colspan="7" class="div-item-pessoa" style="text-align: center;">
            NENHUM REGISTRO NA LISTA
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>


</div>
