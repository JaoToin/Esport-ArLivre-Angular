<div id="div-form">

  <form id="form-atleta" (submit)="enviaDadosAtleta()">

    <h1>cadastro de Atleta</h1>

    <label for="nome">Nome</label>
    <input type="text" name="nome" id="nome" class="input01" required maxlength="80" placeholder="Informe seu nome" [(ngModel)]="nome">

    <label for="data">Data</label>
    <input type="date" name="data" id="data" [(ngModel)]="data">

    <label for="cpf">CPF</label>
    <input type="text" name="cpf" id="cpf" class="input02" required maxlength="14" placeholder="Informe seu cpf" [(ngModel)]="cpf">

    <label for="sexo">Sexo</label>
    <input type="radio" name="sexo" id="sexoM" class="bntSelecao" value="M" [(ngModel)]="sexo">Masculino
    <input type="radio" name="sexo" id="sexoF" class="bntSelecao" value="F" [(ngModel)]="sexo">Feminino
    <input type="radio" name="sexo" id="sexoND" class="bntSelecao" value="ND" [(ngModel)]="sexo">Não Declarar


    <label for="cep">CEP</label>
    <input type="number" name="cep" id="cep" class="input02" required maxlength="8" placeholder="Informe seu CEP" [(ngModel)]="cep">

    <label for="rua-logradouro">Rua/Logradouro</label>
    <input type="text" name="rua-logradouro" id="rua-logradouro" class="input01" required maxlength="20" placeholder="Informe sua Rua" [(ngModel)]="rua_logradouro">

    <label for="bairro">Bairro</label>
    <input type="text" name="bairro" id="bairro" class="input02" required maxlength="20" placeholder="Informe seu bairro" [(ngModel)]="bairro">

    <label for="cidade">Cidade</label>
    <input type="text" name="cidade" id="cidade" class="input02" required maxlength="20" placeholder="Informe sua cidade" [(ngModel)]="cidade">

    <label for="uf">UF</label>
    <input type="text" name="uf" id="uf" class="input02" required maxlength="2" placeholder="Informe seu UF" [(ngModel)]="uf">

    <div id="div-bnts">
      <button type="submit" id="bntAdd" >Cadastrar Atleta</button>
      <button type="reset" id="bntLimpar" (click)="limpar()">Limpar Dados</button>

    </div>



  </form>
</div>
